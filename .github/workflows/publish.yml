name: Publish npm Package

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Run linter and tests
        run: |
          npm run lint
          npm run test

      - name: Configure Git User Identity
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Bump version (skips if already released)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/v$VERSION$"; then
            echo "v$VERSION already released, skipping bump"
          else
            npm run release
            git push --follow-tags origin master
          fi

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish package (npm Trusted Publishing, no static token)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER already on registry, skipping publish"
          else
            npm publish
          fi
